services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mystcrag
      POSTGRES_USER: mystcrag
      POSTGRES_PASSWORD: mystcrag_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystcrag -d mystcrag"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - mystcrag_postgres_data:/var/lib/postgresql/data
      - ./packages/database/docker/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro

volumes:
  mystcrag_postgres_data:
